name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Compile Python
        run: python -m compileall -q app

      - name: Check JavaScript
        run: node --check static/app.js && node --check static/login.js

      - name: Check Bash
        run: bash -n install-fedora.sh bin/*.sh scripts/*.sh
